name: Repository Integrity

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Least-privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

# One run per ref: a new push cancels the in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # JOB 1 — Lint. Delegates entirely to .pre-commit-config.yaml so
  # local `pre-commit run --all-files` and CI cannot drift apart.
  # Covers: shellcheck, ruff, markdownlint, whitespace/EOF, YAML,
  # symlink health, shebang/executable-bit agreement, private keys.
  # ============================================================
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # ============================================================
  # JOB 2 — Structure. The checks pre-commit does not cover:
  # required files, submodule health, and config-file exec bits.
  # ============================================================
  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Required files present
        run: make required-files

      - name: Shebang scripts are executable
        run: make perms-check

      - name: Config files must NOT be executable
        run: |
          BAD=()
          CONFIG_PATTERNS=("*.conf" "*.condarc" "config" ".zshrc" ".zprofile" ".zshenv" "zshrc" "zprofile" "zshenv")
          for pat in "${CONFIG_PATTERNS[@]}"; do
            while IFS= read -r -d '' f; do
              if [[ -x "$f" ]]; then
                echo "⚠️  Should not be executable: $f"
                BAD+=("$f")
              fi
            done < <(find . -not -path './.git/*' -not -path './kitty/tokyo_theme/*' \
                          -not -path './tools/*' -type f -name "$pat" -print0)
          done
          if [[ ${#BAD[@]} -gt 0 ]]; then
            echo ""
            echo "Fix with: chmod -x <file>"
            exit 1
          fi
          echo "✅ Config file permissions OK"

      - name: Submodules initialised
        run: |
          echo "--- Registered submodules ---"
          git submodule status

          UNINIT=$(git submodule status | grep '^-' || true)
          if [[ -n "$UNINIT" ]]; then
            echo ""
            echo "❌ The following submodules are not initialised:"
            echo "$UNINIT"
            exit 1
          fi
          echo "✅ All submodules initialised"

      - name: Report submodules far behind their remote
        run: |
          git submodule foreach --quiet '
            BEHIND=$(git log HEAD..origin/$(git symbolic-ref --short HEAD 2>/dev/null || echo main) --oneline 2>/dev/null | wc -l)
            if [ "$BEHIND" -gt 20 ]; then
              echo "⚠️  $name is $BEHIND commits behind its remote branch"
            else
              echo "✅  $name is up to date (or within 20 commits)"
            fi
          '

  # ============================================================
  # JOB 3 — Install smoke test.
  # Everything above lints *style*. This one is the only job that
  # proves the config actually works once installed: it runs the
  # installer in a clean container and asserts the results.
  # ============================================================
  install-smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates zsh bash make >/dev/null

      # Submodules are not needed: nothing the installer links lives in one.
      - name: Checkout
        uses: actions/checkout@v7

      - name: install.sh --dry-run makes no changes
        run: |
          ./install.sh --dry-run
          test ! -e "$HOME/.zshenv" || { echo "❌ dry-run created files"; exit 1; }
          echo "✅ dry-run is side-effect free"

      - name: Install
        run: ./install.sh --no-conda

      - name: Symlinks point back into the repo
        run: |
          fail=0
          check() {
            if [ -L "$1" ] && [ -e "$1" ]; then
              echo "✅ $1 -> $(readlink "$1")"
            else
              echo "❌ $1 is not a working symlink"; fail=1
            fi
          }
          check "$HOME/.zshenv"
          check "$HOME/.config/zsh/.zshrc"
          check "$HOME/.config/zsh/.zprofile"
          check "$HOME/.config/zsh/env.d"
          check "$HOME/.bashrc"
          check "$HOME/.profile"
          check "$HOME/.gitconfig"
          check "$HOME/.ssh/config"
          check "$HOME/.config/tmux/tmux.conf"
          exit $fail

      - name: Local templates created, not symlinked
        run: |
          for f in "$HOME/.gitconfig.local" "$HOME/.ssh/config.local"; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then echo "✅ $f"; else echo "❌ $f missing"; exit 1; fi
          done
          test "$(stat -c '%a' "$HOME/.ssh")" = "700" || { echo "❌ ~/.ssh not 0700"; exit 1; }
          echo "✅ ~/.ssh is 0700"

      - name: Shells start cleanly
        run: |
          zsh -c 'exit'  || { echo "❌ non-interactive zsh failed"; exit 1; }
          out=$(zsh -i -c 'echo READY' 2>/dev/null)
          test "$out" = "READY" || { echo "❌ interactive zsh polluted stdout: [$out]"; exit 1; }
          # 2>/dev/null: a container has no controlling tty, so interactive bash
          # warns about job control. Harmless here and not what we're testing.
          bash -i -c 'exit' 2>/dev/null || { echo "❌ interactive bash failed"; exit 1; }
          echo "✅ zsh and bash start clean"

      - name: Zsh history is actually configured
        run: |
          eval "$(zsh -i -c 'printf "H=%s\nS=%s\n" "$HISTFILE" "$SAVEHIST"' 2>/dev/null)"
          test -n "$H" || { echo "❌ HISTFILE unset — history would not persist"; exit 1; }
          test "${S:-0}" -gt 0 || { echo "❌ SAVEHIST is 0 — history would not persist"; exit 1; }
          test -d "$(dirname "$H")" || { echo "❌ history dir missing: $(dirname "$H")"; exit 1; }
          echo "✅ HISTFILE=$H SAVEHIST=$S"

      - name: Referenced include paths resolve
        run: |
          # kitty is not installed in this container, so the installer skips it —
          # but the theme include inside kitty.conf must still point at a real file.
          inc=$(sed -n 's|^include ~/dotfiles/||p' kitty/kitty.conf)
          test -f "$inc" || { echo "❌ kitty include does not resolve: $inc"; exit 1; }
          echo "✅ kitty include resolves: $inc"

      - name: Re-running is idempotent
        run: |
          ./install.sh --no-conda | tee /tmp/second.log
          if grep -q '^\[info\]  backup' /tmp/second.log; then
            echo "❌ second run backed files up — not idempotent"; exit 1
          fi
          echo "✅ second run made no changes"

  # ============================================================
  # JOB 4 — Secret scanning over the full history.
  # pre-commit's gitleaks hook only sees the working tree; this
  # scans every commit. Runs even if earlier jobs failed.
  # ============================================================
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    # SARIF upload writes to the Security → Code scanning tab.
    permissions:
      contents: read
      security-events: write
    needs: [lint, structure, install-smoke]
    if: always()
    steps:
      - name: Checkout (full history + submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history so gitleaks can scan every commit, not just HEAD
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for org-owned repos; free key from gitleaks.io.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Upload the SARIF report so findings appear in the
      # GitHub Security → Code scanning tab (free for public repos)
      - name: Upload SARIF report
        if: failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        continue-on-error: true   # don't mask the gitleaks failure

      - name: Summarise findings on failure
        if: failure()
        run: |
          echo "❌ Gitleaks detected secrets or credentials in the repository."
          echo ""
          echo "Steps to remediate:"
          echo "  1. Identify the offending commit shown above."
          echo "  2. Rotate / revoke the exposed credential immediately."
          echo "  3. Remove the secret from history:"
          echo "       git filter-repo --path <file> --invert-paths"
          echo "  4. Force-push the cleaned history and re-run this workflow."
          echo ""
          echo "To allowlist a false positive, add a .gitleaks.toml rule:"
          echo "  [[allowlist]]"
          echo "  description = \"reason\""
          echo "  regexTarget = \"match\""
          echo "  regex = '''<pattern>'''"

  # ============================================================
  # Summary job — fails if any check above failed
  # ============================================================
  integrity-pass:
    name: All Checks Passed
    needs: [lint, structure, install-smoke, gitleaks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate results
        run: |
          RESULTS='${{ toJSON(needs) }}'
          FAILED=$(echo "$RESULTS" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          failed = [k for k, v in needs.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('\n'.join(failed))
          ")

          if [[ -n "$FAILED" ]]; then
            echo "❌ The following checks failed:"
            echo "$FAILED"
            exit 1
          fi

          echo "✅ All integrity checks passed."
